[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdok"
version = "0.1.1"
description = "A document-grade terminal markdown reader with responsive centering and clean tables"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Anton" }
]
keywords = [
    "markdown",
    "terminal",
    "cli",
    "reader",
    "rich",
    "viewer",
    "booktabs",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0.0",
    "markdown-it-py>=3.0.0",
    "pygments>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
mdok = "mdok.cli:main"
mda = "mdok.cli:main"

[project.urls]
Homepage = "https://github.com/anton/mdok"
Repository = "https://github.com/anton/mdok"
Issues = "https://github.com/anton/mdok/issues"

[tool.setuptools.packages.find]
where = ["src"]
